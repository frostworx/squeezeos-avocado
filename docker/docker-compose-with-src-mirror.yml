services:
  squeezeos-dev:
    build: .
    image: squeezeos-dev
    user: 1000:1000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - SQUEEZEOS_SRC_MIRROR=http://nginx/poky-cache
    volumes:
      - ../poky:/poky

    stdin_open: true # docker run -i
    tty: true        # docker run -t
    networks:
      - avocado

  nginx:
    image: nginx:alpine
    volumes:
      - ../squeezeos-avocado-poky-src-mirror/poky-cache:/usr/share/nginx/html/poky-cache:ro
      - ../squeezeos-avocado-poky-src-mirror/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - avocado

networks:
  avocado:
